apiVersion: v1
kind: Namespace
metadata:
  name: tp2
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tp2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: api
        image: hashicorp/http-echo:1.0
        args: ["-listen=:8080", "-text=Bonjour depuis l'API"]
        ports:
        - containerPort: 8080
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits: { memory: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tp2
spec:
  selector:
    app: api
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-html
  namespace: tp2
data:
  index.html: |
    <!doctype html>
    <html>
      <body>
        <h1>Frontend M2 Super Cloud</h1>
      </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tp2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests: { cpu: 50m, memory: 32Mi }
          limits: { memory: 64Mi }
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
      volumes:
      - name: html
        configMap:
          name: frontend-html
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: tp2
spec:
  selector:
    app: frontend
  ports:
  - port: 80
    targetPort: 80
