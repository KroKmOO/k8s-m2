apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-allow-to-mysql
  namespace: tp2
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tp1
      podSelector:
        matchLabels:
          app: mysql
    ports:
    - protocol: TCP
      port: 3306
