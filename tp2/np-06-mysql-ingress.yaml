apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql-restricted-ingress
  namespace: tp1
spec:
  podSelector:
    matchLabels:
      app: mysql
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: tp2
      podSelector:
        matchLabels:
          app: api
    ports:
    - protocol: TCP
      port: 3306
