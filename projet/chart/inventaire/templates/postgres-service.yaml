apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventaire.fullname" . }}-postgres
  labels:
    {{- include "inventaire.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "inventaire.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
  - {name: postgres, port: 5432, targetPort: postgres}
