apiVersion: v1
kind: ServiceAccount
metadata:
  name: lecteur
  labels:
    {{- include "inventaire.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "inventaire.fullname" . }}-lecteur
  labels:
    {{- include "inventaire.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "inventaire.fullname" . }}-lecteur
  labels:
    {{- include "inventaire.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: lecteur
  namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "inventaire.fullname" . }}-lecteur
  apiGroup: rbac.authorization.k8s.io
