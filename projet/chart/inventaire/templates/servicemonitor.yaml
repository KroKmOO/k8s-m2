{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "inventaire.fullname" . }}-api
  labels:
    {{- include "inventaire.labels" . | nindent 4 }}
    release: monitoring
spec:
  selector:
    matchLabels:
      {{- include "inventaire.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  endpoints:
  - port: http
    path: /metrics
    interval: {{ .Values.monitoring.serviceMonitor.interval | quote }}
{{- end }}
