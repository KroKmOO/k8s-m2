apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventaire.fullname" . }}-frontend
  labels:
    {{- include "inventaire.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  selector:
    {{- include "inventaire.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
  ports:
  - {name: http, port: 8080, targetPort: http}
