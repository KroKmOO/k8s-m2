apiVersion: v1
kind: Service
metadata:
  name: {{ include "inventaire.fullname" . }}-api
  labels:
    {{- include "inventaire.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "inventaire.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
  ports:
  - {name: http, port: 3000, targetPort: http}
