apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "inventaire.fullname" . }}-api
  labels:
    {{- include "inventaire.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "inventaire.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
