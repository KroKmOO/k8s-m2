apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "inventaire.fullname" . }}-api
  labels:
    {{- include "inventaire.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
data:
  DB_HOST: {{ printf "%s-postgres" (include "inventaire.fullname" .) | quote }}
  DB_PORT: "5432"
  DB_NAME: {{ .Values.postgres.database | quote }}
  DB_USER: {{ .Values.postgres.user | quote }}
  PORT: "3000"
