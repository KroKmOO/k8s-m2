apiVersion: v1
kind: Pod
metadata:
  name: intrus
  namespace: inventaire
  labels:
    app: intrus
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    runAsNonRoot: true
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: intrus
    image: busybox:1.36
    command: ["/bin/sh", "-c"]
    args:
    - |
      echo "DNS :"; nslookup inventaire-postgres.inventaire.svc.cluster.local || true
      echo "Intrus -> Postgres 5432 (attendu BLOQUE) :"
      if nc -z -w 4 inventaire-postgres 5432; then
        echo "ECHEC: flux non autorise fonctionne"
      else
        echo "OK: flux interdit bloque par NetworkPolicy"
      fi
      sleep 600
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities: {drop: ["ALL"]}
      seccompProfile: {type: RuntimeDefault}
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {cpu: 100m, memory: 64Mi}
