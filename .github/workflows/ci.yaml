name: tp4-inventaire-ci
on:
  push:
    branches: [main]
    paths:
      - "projet/app/**"
  workflow_dispatch:
permissions:
  contents: write
  packages: write
jobs:
  build-scan-push-gitops:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/krokmoo/inventaire-api
    steps:
    - uses: actions/checkout@v4
    - name: Build image
      run: docker build -t "$IMAGE:$GITHUB_SHA" projet/app
    - name: Trivy critical vulnerabilities blocking
      uses: aquasecurity/trivy-action@0.28.0
      with:
        image-ref: ghcr.io/krokmoo/inventaire-api:${{ github.sha }}
        format: table
        severity: CRITICAL
        ignore-unfixed: true
        exit-code: "1"
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Push immutable image
      run: docker push "$IMAGE:$GITHUB_SHA"
    - name: Update GitOps image tag
      run: |
        python3 - <<'PYCODE'
        import os, re
        from pathlib import Path
        path = Path('projet/chart/inventaire/values.yaml')
        source = path.read_text()
        before, marker, tail = source.partition('\napi:\n')
        if not marker:
            raise SystemExit('api block not found in values.yaml')
        api, marker2, after = tail.partition('\npostgres:\n')
        if not marker2:
            raise SystemExit('postgres block not found in values.yaml')
        api, count = re.subn(r'(?m)^(    tag:)\s*.*$',
                             lambda m: m.group(1)+' "'+os.environ['GITHUB_SHA']+'"',
                             api, count=1)
        if count != 1:
            raise SystemExit('api.image.tag not found')
        path.write_text(before + marker + api + marker2 + after)
        PYCODE
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add projet/chart/inventaire/values.yaml
        git diff --cached --quiet || git commit -m "ci: update api image $GITHUB_SHA"
        git push
