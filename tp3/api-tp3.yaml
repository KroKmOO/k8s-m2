apiVersion: v1
kind: Namespace
metadata:
  name: tp3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: tp3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.7.1
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: tp3
  labels:
    app: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trafic
  namespace: tp3
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trafic
  template:
    metadata:
      labels:
        app: trafic
    spec:
      containers:
        - name: trafic
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              while true; do
                wget -qO- http://api:9898/ > /dev/null
                wget -qO- http://api:9898/delay/1 > /dev/null
                sleep 0.5
              done
